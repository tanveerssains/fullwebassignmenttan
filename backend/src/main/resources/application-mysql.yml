spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/employee_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:portal}
    password: ${DB_PASSWORD:portal}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
